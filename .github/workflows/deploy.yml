# Build the site from data/ + layout/ and publish it to GitHub Pages.
#
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Pull requests are built (so broken data fails the check) but not deployed.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race for the Pages environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal build takes about a minute. Fail fast instead of hanging for
    # most of an hour when the runner's network is down.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ImageMagick makes the gallery thumbnails. Skip apt when the runner
      # image already has it; otherwise retry, since the Ubuntu mirrors are
      # occasionally unreachable from the runners for a few minutes.
      - name: Install ImageMagick
        run: |
          if command -v magick >/dev/null || command -v convert >/dev/null; then
            echo "ImageMagick already installed"; exit 0
          fi
          for attempt in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 &&
            sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=20 imagemagick &&
            exit 0
            echo "apt failed (attempt $attempt), retrying in 30s"; sleep 30
          done
          exit 1

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build
        run: python tools/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
