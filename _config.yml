# GitHub Pages builds this repository with Jekyll, straight from main.
# Data is in data/, page bodies in content/, design in layout/; the browser
# renders the data with static/js/site.js. See README.md.

data_dir: data           # data/*/*.yaml, available to layout/partials/data.html
layouts_dir: layout      # layout/base.html
includes_dir: .          # so a page can include layout/... and data/... files

defaults:                # every page in content/ uses layout/base.html
  - scope: { path: content }
    values: { layout: base }

exclude:
  - README.md
  - CLAUDE.md
  - requirements.txt
  - Gemfile
  - Gemfile.lock
  - tools
  - layout
  - "data/*/README.md"


# Site-wide content: header, navigation and footer of every page.

lab_name: Lee Optimization Group
copyright: "© 2026 LOG. All rights reserved."

nav:                     # in order; `page` is the content/ file name
  - { page: index,        label: Home }
  - { page: research,     label: Research }
  - { page: publications, label: Publications }
  - { page: group,        label: Members }
  - { page: hiring,       label: Hiring }
  - { page: contact,      label: Contact }

footer_logos:            # left to right; images in static/logo/
  - { url: "https://www.postech.ac.kr", image: static/logo/postech_logo.png, alt: POSTECH }
  - { url: "https://ai.postech.ac.kr",  image: static/logo/gsai_logo.png,    alt: GSAI }
  - { url: "https://cse.postech.ac.kr", image: static/logo/cs_logo.png,      alt: CS }
