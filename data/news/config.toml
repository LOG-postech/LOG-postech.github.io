# News settings. Details: README.md.

date_format = "%b %Y"   # date under each item → "Oct 2026"


[home]
count = 5               # items in Recent News on the home page


[page]
since = "2026-01"       # oldest month on the News page; older items are kept but hidden

initial = 10            # items shown at first
step = 5                # items added per "Show more"


[faces]
max = 3                 # faces under a date before "+N"
