# Lab members and alumni, in display order. How to add someone: README.md.
#
# Every field of a person (the person's key is their tag, used as @hyunjijung
# in news and papers.bib; never reuse one):
#
# members:
#   hyunjijung:
#     name: Hyunji Jung         # required. Shown under the photo and in author lists
#     short: Hyunji             # optional. Name for @tag in news (default: first word of name)
#     photo: hyunjijung.jpg     # required. File in photos/; also the card anchor group.html#hyunjijung
#     position: MS Student      # required. Shown under the name
#     url: https://...          # optional. Personal site; name and faces link here
#     alt: Hyunji Jung          # optional. Photo description (default: name)
#
# alumni:
#   jaehyeonjeong:              # keep the tag they had as a member
#     name: Jaehyeon Jeong      # required
#     url: https://...          # optional
#     note: (MS 2026 → ETRI)    # optional. Shown after the name

