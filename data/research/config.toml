# Research page settings. Details: README.md.

[icons]
scale = 0.9             # icon size = scale × shortest topic paragraph height
min = 80                # px
max = 200               # px
max_fraction = 0.4      # at most this share of the column width

padding = "12px"        # space between icon and frame
round_padding = "7px"   # same, for icon_class: icon-round
