# Research topics on the Research page, in display order. See README.md.
#
# Every field of a topic:
#
# - key: distributed          # required. Unique id, letters only
#   title: Distributed Training   # required. Coloured heading of the paragraph
#   color: green              # required. red | green | blue | orange
#   icon: opt-distributed.png # required. File in icons/
#   icon_class: icon-round    # optional. Less padding, for round pictures
#   alt: ...                  # optional. Icon description (default: title)
#   hidden: true              # optional. Keep the topic here but off the page
#   summary: >-               # required. The paragraph
#     ...
#   details:                  # optional. Sub-topics shown under "more"
#   - title: Asynchronous Training     # required
#     papers: NeurIPS '26, [ICML '26](https://...)   # optional. Shown in brackets after the title
#     text: >-                # required
#       ...

- key: compression
  title: Model Compression
  color: red
  icon: opt-compression.png
  summary: >-
    As AI models become larger and more computationally demanding, compression is essential
    for making them practical and sustainable. We develop optimization methods that reduce
    training and inference costs while preserving model performance. Our work focuses on extreme
    compression across the AI model lifecycle.
  details:
  - title: Extreme Sparsity
    papers: >-
      EMNLP '26, [ICLR '26](https://arxiv.org/abs/2510.01650), [ICML '25 Spotlight](https://arxiv.org/abs/2506.06866),
      [EMNLP '24](https://arxiv.org/abs/2406.15524)
    text: >-
      We push the limits of LLM sparsity through advanced optimization frameworks such as
      ADMM, aiming for robust generalization even at extreme compression levels.
  - title: Joint Compression
    text: >-
      We develop unified frameworks that integrate pruning, quantization, and distillation
      to reduce error accumulation and preserve core model capabilities, including reasoning,
      in highly compressed states.

- key: distributed
  title: Distributed Training
  color: green
  icon: opt-distributed.png
  icon_class: icon-round
  summary: >-
    The shift toward massive-scale models has made distributed training essential for workloads
    that no single machine can support. From an optimization perspective, the key challenge
    is maintaining efficiency while managing the overhead of communication between devices.
    Our research develops robust algorithms for decentralized and high-latency training environments.
  details:
  - title: Communication-Efficient Training
    papers: '[NeurIPS ''26 WS](https://arxiv.org/abs/2602.18181)'
    text: >-
      We design methods that reduce the heavy data-sharing requirements of distributed training
      through information compression, reduced synchronization, and zeroth-order optimization.
  - title: Asynchronous Training
    papers: NeurIPS '26, [ICML '26](https://arxiv.org/abs/2602.03515)
    text: >-
      We create algorithms that allow devices to work independently and reduce waiting time,
      with a focus on correcting errors caused by slightly outdated information.
  - title: Device-Heterogeneous Training
    text: >-
      We develop adaptive strategies for imbalanced computational resources across devices,
      aiming for consistent global convergence despite variations in hardware performance.

- key: applications
  title: Deep Learning Applications
  color: blue
  icon: opt-applications.png
  hidden: true
  summary: >-
    Optimization is not only a subject of study in itself, but also a versatile lens through
    which we tackle challenges in interpretability, uncertainty quantification, continual
    learning, and other real-world deep learning systems. Our research explores how optimization
    principles can be extended and applied to address such challenges.
  details:
  - title: Trustworthy Machine Learning
    papers: >-
      ECCV '26, ACL '26 Oral, [NeurIPS '25](https://arxiv.org/abs/2505.16705), [ICML '23](https://arxiv.org/abs/2302.14260)
    text: >-
      We bridge complex model architectures and human understanding, from uncovering model
      logic in realistic scenarios to evaluating the reliability of model outputs.
  - title: Continual Adaptation
    papers: '[NeurIPS ''25](https://arxiv.org/abs/2510.25798)'
    text: >-
      We study constrained optimization problems where models adapt to new knowledge without
      disrupting what has already been learned, opening principled approaches to continual
      learning.

- key: optimization
  title: Advanced Optimization
  color: orange
  icon: opt-deep.png
  icon_class: icon-round
  summary: >-
    Optimization has long been a source of crucial ideas that drastically enhance all corners
    of deep neural network training, and many of its most impactful questions remain open.
    Our research investigates these questions and develops optimization principles and algorithms
    for modern deep learning systems.
  details:
  - title: Optimization for Generalization
    papers: '[UAI ''25](https://arxiv.org/abs/2311.17539), [ICML ''25](https://arxiv.org/abs/2502.18153)'
    text: >-
      We study the role of loss landscape curvature in generalization and develop flatness-oriented
      optimization strategies with both theoretical advantages and scalability for modern
      deep neural networks.
  - title: Zeroth-Order Optimization for Black-Box Model Training
    papers: '[ICLR ''25](https://arxiv.org/abs/2504.06838)'
    text: >-
      We develop methods that operate without direct gradient access, motivated by settings
      such as proprietary model APIs and decentralized learning systems where gradients are
      unavailable.
