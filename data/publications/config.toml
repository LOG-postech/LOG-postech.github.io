# Presentation settings for publications. Papers are in papers.bib.

[groups]
# Headings. Papers with is_preprint = {true} come first under `preprint`, then
# one heading per year (newest first, from each paper's year), then papers with
# is_previous = {true} under `previous`.
preprint = "Preprint"
previous = "Previous"

[links]
# Text between the [paper] [code] ... links of one paper. A paper with
# spaced_links = {true} uses a space instead.
separator = ""
